<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="header-inner">
      <h1>Content Planner</h1>
      <div class="header-actions">
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="in-progress">In Progress</button>
          <button class="filter-btn" data-filter="finalized">Finalized</button>
        </div>
        <button class="add-btn" id="openUpload">+ New Post</button>
      </div>
    </div>
  </header>

  <!-- Feed Grid -->
  <main>
    <div class="grid" id="feed" role="list"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <p>No posts yet.<br>Click <strong>+ New Post</strong> to get started.</p>
    </div>
  </main>

  <!-- Upload Modal -->
  <div class="overlay" id="uploadOverlay">
    <div class="modal upload-modal">
      <button class="close-btn" id="closeUpload">✕</button>
      <h2>New Post</h2>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" multiple />
        <div class="drop-zone-inner">
          <span class="drop-icon">↑</span>
          <p>Drop images here or <strong>click to browse</strong></p>
          <p class="hint">Up to 10 images · JPG, PNG, WEBP</p>
        </div>
      </div>

      <div class="preview-strip" id="previewStrip"></div>

      <div class="form-group">
        <label>Planned Date</label>
        <input type="date" id="uploadDate" />
      </div>

      <div class="form-group">
        <label>Comments / Notes</label>
        <textarea id="uploadComment" rows="4" placeholder="Add notes for your team…"></textarea>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="uploadStatus">
          <option value="in-progress">In Progress</option>
          <option value="finalized">Finalized</option>
        </select>
      </div>

      <button class="save-btn" id="savePost">Save Post</button>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="overlay" id="detailOverlay">
    <div class="modal detail-modal">
      <button class="close-btn" id="closeDetail">✕</button>
      <button class="delete-btn" id="deletePost">Delete</button>

      <!-- Image gallery -->
      <div class="gallery-main">
        <img id="galleryMain" src="" alt="" />
        <button class="gallery-nav prev" id="galleryPrev">‹</button>
        <button class="gallery-nav next" id="galleryNext">›</button>
        <span class="gallery-counter" id="galleryCounter"></span>
      </div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>

      <!-- Details form -->
      <div class="detail-fields">
        <div class="form-group">
          <label>Planned Date</label>
          <input type="date" id="detailDate" />
        </div>
        <div class="form-group">
          <label>Comments / Notes</label>
          <textarea id="detailComment" rows="4" placeholder="Add notes for your team…"></textarea>
        </div>
        <div class="form-group status-group">
          <label>Status</label>
          <select id="detailStatus">
            <option value="in-progress">In Progress</option>
            <option value="finalized">Finalized</option>
          </select>
        </div>
        <button class="save-btn" id="saveDetail">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
